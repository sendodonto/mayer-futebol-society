<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mayer — Campo 3D</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>html,body{height:100%;margin:0;background:#101b18;color:#b4c8ba;font:13px Arial}model-viewer{width:100%;height:100%;--poster-color:#101b18}#error{position:absolute;bottom:20px;left:20px;right:20px;text-align:center;padding:12px;border:1px solid #445b48;background:#20312a;border-radius:6px;display:none}a{color:#ff7638}</style></head><body><model-viewer id="model" camera-controls touch-action="pan-y" shadow-intensity="1" environment-image="neutral" exposure="1" camera-orbit="45deg 55deg auto" alt="Modelo ilustrativo de campo society Mayer"></model-viewer><div id="error">O visualizador 3D não carregou. <a id="download">Baixar modelo GLB</a></div><script>const court=new URLSearchParams(location.search).get('court')==='fut7'?'fut7':'fut5',model=document.getElementById('model');model.src='/models/'+court+'.glb';model.poster='/images/'+court+'.png';document.getElementById('download').href=model.src;model.addEventListener('error',()=>document.getElementById('error').style.display='block');setTimeout(()=>{if(!customElements.get('model-viewer'))document.getElementById('error').style.display='block'},12000);</script></body></html>
